<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姚老師數學教室 - 數學冒險地圖</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="cat-icon.svg" alt="Cat" class="header-icon float-cat">
            <h1>姚老師數學冒險</h1>
            <p>跟著小貓一起探索數學王國吧！</p>
        </div>
    </header>

    <main class="map-wrapper">
        <div class="map-container">
            <!-- Starting point -->
            <div class="start-point">
                <img src="cat-icon.svg" alt="Cat" class="start-cat">
                <span>出發點</span>
            </div>

            <!-- Path Nodes -->
            <div class="node-row node-left">
                <a href="https://gemini.google.com/share/b1695405f7c6" target="_blank" class="level-node low-grade-node" data-label="低年級 1">
                    <span class="level-num">1</span>
                </a>
            </div>

            <div class="node-row node-right">
                <a href="https://gemini.google.com/share/d9bc36cda428" target="_blank" class="level-node low-grade-node" data-label="低年級 2">
                    <span class="level-num">2</span>
                </a>
            </div>

            <div class="node-row node-center">
                <a href="https://gemini.google.com/share/03659a058164" target="_blank" class="level-node mid-grade-node" data-label="中年級 1">
                    <span class="level-num">3</span>
                </a>
            </div>

            <div class="node-row node-left">
                <a href="https://gemini.google.com/share/116e4904e05c" target="_blank" class="level-node mid-grade-node" data-label="中年級 2">
                    <span class="level-num">4</span>
                </a>
            </div>

            <div class="node-row node-right">
                <a href="https://gemini.google.com/share/714a9c1368d2" target="_blank" class="level-node high-grade-node" data-label="高年級 1">
                    <span class="level-num">5</span>
                </a>
            </div>

            <div class="node-row node-center">
                <a href="https://gemini.google.com/share/d831fb679647" target="_blank" class="level-node high-grade-node" data-label="高年級 2">
                    <span class="level-num">6</span>
                </a>
            </div>

            <!-- Goal -->
            <div class="goal-point">
                <span class="goal-star">⭐</span>
                <span>終點</span>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 姚老師數學教室. 展開驚奇的數學冒險之旅！</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姚老師數學教室 - 數學冒險地圖</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <img src="cat-icon.svg" alt="Cat" class="header-icon float-cat">
            <h1>姚老師數學冒險</h1>
            <p>橫越數學王國，解鎖所有關卡吧！</p>
        </div>
    </header>

    <main class="adventure-map">
        <div class="path-container">
            <!-- The SVG Path Line -->
            <svg class="map-path-svg" viewBox="0 0 1000 400" preserveAspectRatio="none">
                <path d="M 50 200 Q 250 50 500 200 T 950 200" fill="none" stroke="#FFD1DC" stroke-width="8" stroke-dasharray="15, 15" />
            </svg>

            <!-- Level Nodes positioned along the curve -->
            <div class="map-items">
                <div class="start-marker" style="left: 2%; top: 50%;">
                    <img src="cat-icon.svg" alt="Cat" class="marker-cat">
                    <span>起點</span>
                </div>

                <a href="https://gemini.google.com/share/b1695405f7c6" target="_blank" class="map-node level-1" data-label="低年級 1" style="left: 15%; top: 35%;">1</a>
                <a href="https://gemini.google.com/share/d9bc36cda428" target="_blank" class="map-node level-2" data-label="低年級 2" style="left: 30%; top: 20%;">2</a>
                <a href="https://gemini.google.com/share/03659a058164" target="_blank" class="map-node level-3" data-label="中年級 1" style="left: 50%; top: 50%;">3</a>
                <a href="https://gemini.google.com/share/116e4904e05c" target="_blank" class="map-node level-4" data-label="中年級 2" style="left: 70%; top: 35%;">4</a>
                <a href="https://gemini.google.com/share/714a9c1368d2" target="_blank" class="map-node level-5" data-label="高年級 1" style="left: 85%; top: 50%;">5</a>
                <a href="https://gemini.google.com/share/d831fb679647" target="_blank" class="map-node level-6" data-label="高年級 2" style="left: 95%; top: 50%;">6</a>

                <div class="goal-marker" style="left: 98%; top: 50%;">
                    <span class="star">⭐</span>
                    <span>終點</span>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 姚老師數學教室. 踏上橫向冒險的征途！</p>
    </footer>
</body>
</html>
